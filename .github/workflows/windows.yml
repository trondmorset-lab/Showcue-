name: Bygg ShowCue for Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # for å legge ferdig program i releasen «siste»

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publiser
        working-directory: Windows
        run: dotnet publish ShowCue/ShowCue.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@v4
        continue-on-error: true   # full lagringskvote skal ikke gjøre bygget rødt
        with:
          name: ShowCue-Windows
          path: Windows/publish/ShowCue.exe
          retention-days: 7

      # Ferdig program legges i releasen «siste» (teller ikke mot artefaktkvoten).
      - name: Publiser til release «siste»
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view siste >/dev/null 2>&1 || gh release create siste --prerelease --title "Siste bygg" --notes "Bygges automatisk fra main ved hver endring. Mac: ShowCue-Mac.zip. Windows: ShowCue.exe."
          gh release upload siste "Windows/publish/ShowCue.exe" --clobber
